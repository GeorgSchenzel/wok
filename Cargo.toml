[package]
name = "wok"
version = "0.1.0"
edition = "2021"
description = "GPU jobs from any box, jailed on the GPU machine"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
